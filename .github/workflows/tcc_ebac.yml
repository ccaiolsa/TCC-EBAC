name: Teste E2E

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-web:
    name: web test (Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: login no dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Subindo container
        run: docker compose up -d --build

      - name: Cypress run
        continue-on-error: true
        id: cypress
        uses: cypress-io/github-action@v7
        with:
          working-directory: suites/UI
          install: false
          wait-on: 'http://localhost:80'
          record: true
          browser: chrome
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload mochawesome report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: suites/reports/mochawesome-reporter
          retention-days: 5

      - name: se o teste falhar
        if: steps.cypress.outcome == 'failure'
        run: exit 1

      - name: Derrubando container
        if: always()
        run: docker compose down -v

  test-mobile:
    name: mobile test (WebdriverIO + SauceLabs)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      REPORTER: 'true'
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Wdio run
        continue-on-error: true
        id: wdio
        run: npm run test:mobile

      - name: Generate Allure report
        if: always()
        run: npx --package=allure-commandline -- allure generate suites/reports/allure-results -o suites/reports/allure-report --clean

      - name: allure report (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: suites/reports/allure-report
          retention-days: 5

      - name: Se o job falhar
        if: steps.wdio.outcome == 'failure'
        run: exit 1

  test-api:
    name: api test com Supertest
    runs-on: ubuntu-latest
    env:
      EMAIL_API: ${{ secrets.EMAIL_API }}
      SENHA_API: ${{ secrets.SENHA_API }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Instalar dependencias
        run: npm ci

      - name: subindo container
        run:  docker build -t hub-de-leitura -f Dockerfile ./hub-de-leitura-integrado

      - name: subindo servidor
        run: docker run -d --name hub-de-leitura -p 3000:3000 hub-de-leitura

      - name: Executar supertest
        continue-on-error: true
        id: supertest
        run: npm run test:api

      - name: v8 coverage (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8
          path: suites/reports/API/v8
          retention-days: 5

      - name: Se o job falhar
        if: steps.supertest.outcome == 'failure'
        run: exit 1

  performance:
      name: performance test (k6)
      runs-on: ubuntu-latest
      steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      
      - name: subindo container
        run:  docker build -t hub-de-leitura -f Dockerfile ./hub-de-leitura-integrado

      - name: subindo servidor
        run: docker run -d --name hub-de-leitura -p 3000:3000 hub-de-leitura

      - name: Executar testes
        uses: grafana/run-k6-action@v1
        with:
          path: suites/performance

      - name: US001 - carrinho
        env:
         EMAIL_K6: ${{ secrets.EMAIL_K6 }}
         SENHA_K6: ${{ secrets.SENHA_K6 }}
        run: npm run k6:carrinho

      - name: US002 - login
        env:
         EMAIL_K6: ${{ secrets.EMAIL_K6 }}
         SENHA_K6: ${{ secrets.SENHA_K6 }}
        run: npm run k6:login
      
  publish-reports:
    name: publicar relatórios na branch "reports"
    needs: [test-web, test-mobile, test-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: download mochawesome report
        uses: actions/download-artifact@v4
        with:
          name: mochawesome-report
          path: report-output/web/mochawesome

      - name: download allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: report-output/mobile/allure
      
      - name: download v8 report
        uses: actions/download-artifact@v4
        with:
          name: v8
          path: report-output/API/v8

      - name: publicar na branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: reports
          publish_dir: ./report-output
          keep_files: false
          commit_message: 'chore(reports): atualiza relatórios web (mochawesome) e mobile (allure) e API (v8)[skip ci]'