name: Teste E2E
on: [push]
permissions: 
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: login no dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Subindo container
        run: docker compose up -d --build
  
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
         wait-on: 'http://localhost:80' 
         record: true
         browser: chrome

        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Salvar Relatório na branch reports
        uses: peaceiris/actions-github-pages@v3.1.12
        if: always()
        with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_branch: reports
         publish_dir: 'tests/reports/mochawesome-reporter'
         commit_message: 'docs: relatorio de testes automáticos [skip ci]'


      - name: Derrubando container
        if: always()
        run: docker compose down -v